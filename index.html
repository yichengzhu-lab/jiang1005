 {t:'exposure to · expose to · readily · readiness',tip:'be exposed to / exposure to 后面都是 to。readily 是副词（乐意地），readiness 是名词（准备好、乐意）。',w:['exposure to','expose to','readily','readiness']},
];
const grpOf={};GROUPS.forEach((g,gi)=>g.w.forEach(e=>{if(byEn[e])(grpOf[e]=grpOf[e]||[]).push(gi)}));
const missing=GROUPS.flatMap(g=>g.w).filter(e=>!byEn[e]);if(missing.length)console.warn('missing',missing);

/* ============ 存储 ============ */
let mem={box:{},wrong:{}};
const KEY='vocab_gk_v1';
function load(){try{const s=localStorage.getItem(KEY);if(s)mem=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){}stat()}
const box=w=>mem.box[w.en]||0;
function stat(){
  const m=W.filter(w=>box(w)>=3).length;
  document.getElementById('stat').textContent=`共 ${W.length} 个 · 已掌握 ${m} · 错词本 ${Object.keys(mem.wrong).length}`;
  document.getElementById('bar').style.width=(m/W.length*100)+'%';
}

/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[\/+].*$/,'').replace(/sth\.|sb\./g,'something'));u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
const posKey=w=>w.pos.split('/')[0].replace(/\./g,'');
function distractors(w,n,sameZhOK=false){
  let c=[];(grpOf[w.en]||[]).forEach(g=>GROUPS[g].w.forEach(e=>{if(e!==w.en&&byEn[e])c.push(byEn[e])}));
  c=shuffle(c);
  const rest=shuffle(W.filter(x=>x!==w&&posKey(x)===posKey(w)&&!c.includes(x)));
  c=c.concat(rest).concat(shuffle(W));
  const out=[];const seen=new Set([w.zh]);
  for(const x of c){if(out.length>=n)break;if(x===w||out.includes(x)||seen.has(x.zh))continue;seen.add(x.zh);out.push(x)}
  return out;
}

/* ============ 导航 ============ */
const TABS=[['flash','闪卡'],['quiz','选择题'],['cloze','语境填空'],['group','易混辨析'],['wrong','错词本'],['how','记忆方法']];
let tab='flash';
function nav(){
  $('nav').innerHTML=TABS.map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
}
function go(t,arg){tab=t;nav();({flash:flashInit,quiz:quizInit,cloze:clozeInit,group:groupView,wrong:wrongView,how:howView})[t](arg);stat()}

/* ============ 闪卡 ============ */
let fq=[],fcur=null,fflip=false,fmode='all',fdir='en';
function flashInit(){buildQ();next()}
function buildQ(){
  let p=W.slice();
  if(fmode==='todo')p=p.filter(w=>box(w)<3);
  if(fmode==='wrong')p=p.filter(w=>mem.wrong[w.en]);
  fq=shuffle(p).sort((a,b)=>box(a)-box(b)).slice(0,30);
  fq=fq.slice(0,12).concat(shuffle(fq.slice(12)));
}
function next(){
  if(!fq.length){buildQ();if(!fq.length){$('main').innerHTML=`<div class="panel score">这个范围里没有词了 🎉<br><br><button class="btn pri" onclick="fmode='all';flashInit()">回到全部</button></div>`;return}}
  fcur=fq.shift();fflip=false;drawFlash();
}
function drawFlash(){
  const w=fcur,front=fdir==='en';
  const chip=(k,t,cur,fn)=>`<span class="chip ${cur===k?'on':''}" onclick="${fn}">${t}</span>`;
  $('main').innerHTML=`<div class="panel">
   <div class="row">范围：${chip('all','全部',fmode,"fmode='all';flashInit()")}${chip('todo','未掌握',fmode,"fmode='todo';flashInit()")}${chip('wrong','错词',fmode,"fmode='wrong';flashInit()")}
   <span style="width:14px"></span>正面：${chip('en','英文',fdir,"fdir='en';drawFlash()")}${chip('zh','中文',fdir,"fdir='zh';drawFlash()")}<span style="margin-left:auto">本轮剩 ${fq.length}</span></div>
   <div class="flash" onclick="fflip=!fflip;drawFlash()">
     ${front?`<div class="en">${w.en}<button class="speak" onclick="event.stopPropagation();speak('${w.en.replace(/'/g,"\\'")}')">🔊</button></div><div class="pos">${w.pos}</div>`
            :`<div class="zh" style="margin:0">${w.zh}</div><div class="pos">${w.pos}</div>`}
     ${fflip?`<div style="margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;width:100%">
        ${front?`<div class="zh">${w.zh}</div>`:`<div class="en">${w.en}</div>`}
        <div class="ex">${w.html}</div></div>`:`<div class="hint">点击卡片翻面 · 空格也行</div>`}
   </div>
   <div class="btns"><button class="btn no" onclick="rate(false)">不认识 ✗</button><button class="btn yes" onclick="rate(true)">认识 ✓</button></div>
   <div class="hint" style="text-align:center">熟练度 ${'●'.repeat(box(w))}${'○'.repeat(Math.max(0,3-box(w)))}　（3 个点 = 已掌握；快捷键 ← 不认识 / → 认识）</div>
  </div>`;
}
function rate(ok){
  const w=fcur;
  if(ok){mem.box[w.en]=Math.min(4,box(w)+1)}
  else{mem.box[w.en]=0;mem.wrong[w.en]=(mem.wrong[w.en]||0)+1;fq.splice(Math.min(fq.length,3+(Math.random()*3|0)),0,w)}
  save();next();
}
document.addEventListener('keydown',e=>{
  if(tab!=='flash'||!fcur)return;
  if(e.key===' '){e.preventDefault();fflip=!fflip;drawFlash()}
  if(e.key==='ArrowLeft')rate(false);if(e.key==='ArrowRight')rate(true);
});

/* ============ 选择题 ============ */
let Q={list:[],i:0,ok:0,dir:'en2zh',pool:'all'};
function quizInit(){
  const pool=Q.pool==='wrong'?W.filter(w=>mem.wrong[w.en]):Q.pool==='todo'?W.filter(w=>box(w)<3):W;
  if(!pool.length){$('main').innerHTML=`<div class="panel score">${Q.pool==='wrong'?'错词本是空的，太棒了！':'该范围没有词'}<br><br><button class="btn pri" onclick="Q.pool='all';quizInit()">用全部词</button></div>`;return}
  Q.list=shuffle(pool).slice(0,10);Q.i=0;Q.ok=0;quizQ();
}
function quizQ(){
  if(Q.i>=Q.list.length){
    $('main').innerHTML=`<div class="panel score"><big>${Q.ok}/${Q.list.length}</big>${Q.ok===Q.list.length?'全对！':'答错的已自动进入错词本'}<br><br><button class="btn pri" onclick="quizInit()">再来一轮</button></div>`;return}
  const w=Q.list[Q.i],e2z=Q.dir==='en2zh';
  const opts=shuffle([w,...distractors(w,3)]);
  const chip=(k,t,cur,fn)=>`<span class="chip ${cur===k?'on':''}" onclick="${fn}">${t}</span>`;
  $('main').innerHTML=`<div class="panel">
   <div class="row">方向：${chip('en2zh','英→中',Q.dir,"Q.dir='en2zh';quizInit()")}${chip('zh2en','中→英',Q.dir,"Q.dir='zh2en';quizInit()")}
   范围：${chip('all','全部',Q.pool,"Q.pool='all';quizInit()")}${chip('todo','未掌握',Q.pool,"Q.pool='todo';quizInit()")}${chip('wrong','错词本',Q.pool,"Q.pool='wrong';quizInit()")}
   <span style="margin-left:auto">${Q.i+1} / ${Q.list.length}</span></div>
   <div class="q">${e2z?w.en:w.zh}${e2z?`<button class="speak" onclick="speak('${w.en.replace(/'/g,"\\'")}')">🔊</button>`:''}</div>
   <div class="pos" style="text-align:center">${w.pos}</div>
   <div class="opts">${opts.map(o=>`<button class="opt" data-k="${o.i}" onclick="quizPick(${o.i})">${e2z?o.zh:o.en}</button>`).join('')}</div>
   <div class="fb" id="fb"></div></div>`;
}
function quizPick(i){
  const w=Q.list[Q.i];if(document.querySelector('.opt.right'))return;
  const ok=i===w.i;
  document.querySelectorAll('.opt').forEach(b=>{const k=+b.dataset.k;if(k===w.i)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
  record(w,ok);if(ok)Q.ok++;
  $('fb').innerHTML=`<div class="ex" style="margin:0 auto">${w.html}</div><div style="margin-top:10px"><button class="btn pri" onclick="Q.i++;quizQ()">下一题 →</button></div>`;
}
function record(w,ok){
  if(ok){if(mem.wrong[w.en]){mem.wrong[w.en]--;if(mem.wrong[w.en]<=0)delete mem.wrong[w.en]}mem.box[w.en]=Math.min(4,box(w)+1)}
  else{mem.wrong[w.en]=(mem.wrong[w.en]||0)+1;mem.box[w.en]=0}
  save();
}

/* ============ 语境填空 ============ */
let C={list:[],i:0,ok:0,g:null};
function clozeInit(g){
  if(typeof g==='number')C.g=g;else if(g===null||g===undefined||g==='all')C.g=null;
  const base=W.filter(w=>w.clozeOK&&(C.g===null||GROUPS[C.g].w.includes(w.en)));
  C.list=shuffle(base).slice(0,10);C.i=0;C.ok=0;clozeQ();
}
function clozeQ(){
  if(C.i>=C.list.length){
    $('main').innerHTML=`<div class="panel score"><big>${C.ok}/${C.list.length}</big>${C.ok===C.list.length?'全对！':'错的已进入错词本'}<br><br><button class="btn pri" onclick="clozeInit(C.g===null?'all':C.g)">再来一轮</button> <button class="btn no" onclick="C.g=null;clozeInit('all')">全部词</button></div>`;return}
  const w=C.list[C.i];
  const pool=C.g!==null?GROUPS[C.g].w.map(e=>byEn[e]).filter(x=>x&&x!==w&&x.clozeOK):[];
  const ds=pool.length>=3?shuffle(pool).slice(0,3):distractors(w,3).filter(x=>x.clozeOK).concat(distractors(w,6)).filter((x,i,a)=>a.indexOf(x)===i&&x!==w).slice(0,3);
  const opts=shuffle([w,...ds]);
  $('main').innerHTML=`<div class="panel">
   <div class="row">${C.g!==null?'练习：'+GROUPS[C.g].t.split(' · ').slice(0,3).join(' · ')+'…':'范围：全部词'}<span style="margin-left:auto">${C.i+1} / ${C.list.length}</span></div>
   <div class="qs">${w.ex.replace(/\{\{(.+?)\}\}/,'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>')}</div>
   <div class="opts">${opts.map(o=>`<button class="opt" data-k="${o.i}" onclick="clozePick(${o.i})" style="font-family:Georgia,serif">${o.en}</button>`).join('')}</div>
   <div class="fb" id="fb"></div></div>`;
}
function clozePick(i){
  const w=C.list[C.i];if(document.querySelector('.opt.right'))return;
  const ok=i===w.i;
  document.querySelectorAll('.opt').forEach(b=>{const k=+b.dataset.k;if(k===w.i)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
  record(w,ok);if(ok)C.ok++;
  const dis=byEn[W[i].en];
  $('fb').innerHTML=`<div class="ex" style="margin:0 auto">${w.html}</div>
   <div style="margin:6px 0"><b style="font-family:Georgia">${w.en}</b> = ${w.zh}${!ok?`　<span style="color:var(--mute)">（你选的 ${dis.en} = ${dis.zh}）</span>`:''}</div>
   <button class="btn pri" onclick="C.i++;clozeQ()">下一题 →</button>`;
}

/* ============ 易混辨析 ============ */
function groupView(){
  $('main').innerHTML=`<div class="sub" style="margin-bottom:10px">把长得像、意思容易串的词放在一起对比。看完点右边“练这一组”用例句填空巩固。</div>`+
  GROUPS.map((g,gi)=>`<div class="group"><h3><span style="font-family:Georgia,serif;font-size:15px">${g.t}</span><button class="chip" onclick="go('cloze',${gi})">练这一组</button></h3>
   <div class="tip">💡 ${g.tip}</div>
   <table>${g.w.map(e=>byEn[e]).filter(Boolean).map(w=>`<tr><td>${w.en}<small>${w.pos}</small></td><td><b style="color:var(--acc)">${w.zh}</b><br><span style="font-family:Georgia,serif;color:#5b534a">${w.html}</span></td></tr>`).join('')}</table></div>`).join('');
}

/* ============ 错词本 ============ */
function wrongView(){
  const ws=W.filter(w=>mem.wrong[w.en]).sort((a,b)=>mem.wrong[b.en]-mem.wrong[a.en]);
  $('main').innerHTML=`<div class="panel">${ws.length?`
   <div class="row"><span>共 ${ws.length} 个，按错误次数排序。在测验中答对会逐步消除。</span>
   <span style="margin-left:auto"><button class="btn pri" style="padding:8px 16px;font-size:14px" onclick="fmode='wrong';go('flash')">用闪卡复习</button>
   <button class="btn pri" style="padding:8px 16px;font-size:14px" onclick="Q.pool='wrong';go('quiz')">用选择题复习</button></span></div>
   ${ws.map(w=>`<div class="wl"><div><b>${w.en}</b><span class="tag">${w.pos}</span><br><span style="color:#5b534a;font-size:14px">${w.html}</span></div><div style="text-align:right;color:var(--acc);font-weight:600">${w.zh}<br><span style="color:var(--mute);font-weight:400;font-size:12px">错 ${mem.wrong[w.en]} 次</span></div></div>`).join('')}`
   :`<div class="score">错词本是空的。<br>去做几轮测验吧。</div>`}
   <div style="text-align:right;margin-top:16px"><span class="chip" onclick="if(confirm('清空所有进度和错词？')){mem={box:{},wrong:{}};save();wrongView()}">重置全部进度</span></div></div>`;
}

/* ============ 记忆方法 ============ */
function howView(){
  $('main').innerHTML=`<div class="panel m">
  <h3>1. 间隔重复（闪卡的做法）</h3><p>每个词一天看 1 次、隔 2–3 天再看、隔一周再看，比一次背 10 遍有效得多。页面里“认识”会升级熟练度，“不认识”会清零并在本轮几张后再出现。每天 10–15 分钟，比周末集中 2 小时好。</p>
  <h3>2. 主动回忆，别只看</h3><p>先看英文，<b>先在心里说出意思</b>再翻面。翻面前那几秒的“想不起来”才是真正在记忆。也可以切换成“中文在正面”，反向回忆。</p>
  <h3>3. 放进句子里</h3><p>孤立的词义容易忘；带着例句记，就能同时记住搭配和用法（如 agree <u>with</u> 人 / <u>on</u> 事 / <u>to</u> 计划）。语境填空就是练这个。</p>
  <h3>4. 把容易混的词放一起比</h3><p>prospect / respective / respectful / respectable 这种词，分开背最容易串。“易混辨析”页给了每组一个区分线索（词根、词性、主语方向）。</p>
  <h3>5. 拆词根，一个根记一串</h3><p>spect=看（prospect, perspective, respect）；ident=相同（identical, identity, identify）；integr=整体（integrate, integral, integrity）；liter=字母（literature, literary, literacy）；pre/prior=前（previous, previously, prior to, priority）。</p>
  <h3>6. 错词本优先</h3><p>错过的词，下次最可能再错。每天先清错词，再做新词，错词本会随着你答对自动变短。</p>
  <h3>7. 让学生自己“教”你</h3><p>家教时可以让学生给每个词编一个自己的句子，或用中文解释给你听。能讲清楚，才是真会了。</p>
  </div>`;
}

load();nav();stat();flashInit();
</script>
